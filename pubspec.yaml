name: tram_alert_v_0_1
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  home_widget: ^0.9.0
  http: ^1.6.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/czech_flag_1280.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/czech_flag_1280.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/czech_flag_1280.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/czech_flag_1280.png
  android_12:
    image: assets/branding/czech_flag_1280.png
    color: "#FFFFFF"
